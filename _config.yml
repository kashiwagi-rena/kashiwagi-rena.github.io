# =========================================================
# Jekyll の設定ファイル
# ⚠️ このファイルを変更したときは、push すると反映されます
#    （ローカルで jekyll serve している場合は再起動が必要です）
# =========================================================
title: kashiwagi-rena
description: 履歴書・職務経歴書とブログ
lang: ja_JP
timezone: Asia/Tokyo
url: https://kashiwagi-rena.github.io
baseurl: ""

# 記事のURL： /blog/2026/10/hello-blog/ のような形になる
# ファイル名の日付より後ろ（hello-blog）が URL になるので、英数字とハイフンで付けるのがおすすめ
permalink: /blog/:year/:month/:title/

markdown: kramdown
kramdown:
  input: GFM               # GitHub と同じ書き方の Markdown
  syntax_highlighter: rouge # コードブロックの色付け

# GitHub Pages で使えるプラグインだけを指定する
plugins:
  - jekyll-feed     # /feed.xml（RSS）を自動生成
  - jekyll-seo-tag  # タイトルや OGP（SNSでシェアしたときのカード）を自動生成

# 記事のデフォルト設定（各記事で毎回書かなくてよくなる）
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav: blog

# サイトとして公開しないファイル
exclude:
  - README.md
  - private/
  - Gemfile
  - Gemfile.lock
