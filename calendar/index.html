---
layout: default.html
title: カレンダー
nav: calendar
---
<link rel="stylesheet" href="{{ '/css/calendar.css' | withHash | url }}">

<h1 class="page-title">Calendar</h1>

<section class="card calendar" aria-labelledby="calendar-title">
  <div class="calendar__head">
    <button class="calendar__nav" type="button" data-calendar-move="-1" aria-label="前の月">‹</button>
    <h2 class="calendar__title" id="calendar-title" aria-live="polite">&nbsp;</h2>
    <button class="calendar__nav" type="button" data-calendar-move="1" aria-label="次の月">›</button>
  </div>
  <button class="calendar__today" type="button" data-calendar-today>今月</button>

  <table class="calendar__table">
    <thead>
      <tr>
        <th scope="col" class="is-sun" abbr="日曜日">日</th>
        <th scope="col" abbr="月曜日">月</th>
        <th scope="col" abbr="火曜日">火</th>
        <th scope="col" abbr="水曜日">水</th>
        <th scope="col" abbr="木曜日">木</th>
        <th scope="col" abbr="金曜日">金</th>
        <th scope="col" class="is-sat" abbr="土曜日">土</th>
      </tr>
    </thead>
    <tbody data-calendar-body></tbody>
  </table>

  <noscript>
    <p>カレンダーを表示するには JavaScript を有効にしてください。</p>
  </noscript>
</section>

<section class="card exercise" aria-labelledby="exercise-title" data-exercise hidden>
  <h2 class="exercise__title" id="exercise-title">&nbsp;</h2>

  <div class="exercise__buttons">
    <button class="exercise__button" type="button" aria-pressed="false" data-activity="pilates">
      <span class="exercise__icon" aria-hidden="true">🧘</span>ピラティス
    </button>
    <button class="exercise__button" type="button" aria-pressed="false" data-activity="run">
      <span class="exercise__icon" aria-hidden="true">🏃</span>ランニング
    </button>
    <button class="exercise__button" type="button" aria-pressed="false" data-activity="walk">
      <span class="exercise__icon" aria-hidden="true">🚶</span>ウォーキング
    </button>
  </div>
  <p class="exercise__hint" data-exercise-hint></p>

  <h3 class="exercise__subtitle" data-summary-title>&nbsp;</h3>
  <dl class="exercise__summary">
    <div><dt>🧘 ピラティス</dt><dd><span data-count="pilates">0</span>回</dd></div>
    <div><dt>🏃 ランニング</dt><dd><span data-count="run">0</span>回</dd></div>
    <div><dt>🚶 ウォーキング</dt><dd><span data-count="walk">0</span>日</dd></div>
  </dl>

  <p class="exercise__note">
    記録はこの端末のこのブラウザにだけ保存されます（サーバーには送信されません）。
    別の端末とは共有されず、ブラウザのデータを消すと記録も消えます。
  </p>
</section>

<script src="{{ '/js/calendar.js' | withHash | url }}" defer></script>
