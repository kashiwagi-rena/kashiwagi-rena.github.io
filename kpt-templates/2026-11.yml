# 2026年11月のKPTテンプレート
# 形式は GitHub の Issue フォーム：https://docs.github.com/ja/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
name: KPT
description: 今日のふりかえり（Keep・Problem・Try）
title: "KPT"
labels: ["kpt"]
body:
  - type: input
    attributes:
      label: 日付
      description: 空欄なら投稿した日（日本時間）になります。別の日の分は 2026-11-16 の形で書いてください
      placeholder: "2026-11-16"
  - type: dropdown
    attributes:
      label: 📋 毎日タスク：英語（Duolingo）
      options:
        - ✅ できた
        - ❌ できなかった
    validations:
      required: true
  - type: textarea
    attributes:
      label: ✅ Keep（今日よかったこと・続けたいこと）
    validations:
      required: true
  - type: textarea
    attributes:
      label: 🔧 Problem（うまくいかなかったこと・モヤっとしたこと）
  - type: dropdown
    attributes:
      label: 🚀 Try：あだちんさんのカリキュラム
      options:
        - ✅ できた
        - ❌ できなかった
    validations:
      required: true
  - type: input
    attributes:
      label: 🚀 Try：カリキュラムで今日やった箇所
      placeholder: "◯◯"
  - type: dropdown
    attributes:
      label: 🚀 Try：毎日24時までに布団に入る
      options:
        - ✅ できた
        - ❌ できなかった
    validations:
      required: true
  - type: textarea
    attributes:
      label: 💬 一言（なんでもOK）
