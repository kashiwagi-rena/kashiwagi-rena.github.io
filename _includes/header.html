<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__logo" href="{{ '/' | url }}">Resume<span>.</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="メニューを開く" data-menu-toggle>
      <span class="menu-toggle__bar" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="メイン">
      <a href="{{ '/rirekisho.html' | url }}" {% if nav == 'rirekisho' %}aria-current="page"{% endif %}>履歴書</a>
      <a href="{{ '/shokumu.html' | url }}" {% if nav == 'shokumu' %}aria-current="page"{% endif %}>職務経歴書</a>
      <a href="{{ '/blog/' | url }}" {% if nav == 'blog' %}aria-current="page"{% endif %}>ブログ</a>
      <a href="{{ '/calendar/' | url }}" {% if nav == 'calendar' %}aria-current="page"{% endif %}>カレンダー</a>
      <a href="{{ '/kpt/' | url }}" {% if nav == 'kpt' %}aria-current="page"{% endif %}>KPT</a>
    </nav>
    {% if printable %}
    <button class="btn-print" type="button" data-print>PDFで保存</button>
    {% endif %}
  </div>
</header>
