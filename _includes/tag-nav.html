{%- comment -%}
  currentTag：今いるタグ名（「すべて」のときは空）
{%- endcomment -%}
<nav class="tag-nav" aria-label="タグで絞り込む">
  <ul>
    <li>
      <a href="{{ '/blog/' | url }}" {% if currentTag == blank %}aria-current="page"{% endif %}>
        すべて <span class="tag-nav__count">{{ collections.posts.size }}</span>
      </a>
    </li>
    {%- for tag in collections.tagList %}
    <li>
      <a href="{{ '/blog/tags/' | append: tag.slug | append: '/' | url }}" {% if currentTag == tag.name %}aria-current="page"{% endif %}>
        {{ tag.name }} <span class="tag-nav__count">{{ tag.count }}</span>
      </a>
    </li>
    {%- endfor %}
  </ul>
</nav>
