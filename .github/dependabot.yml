# SHA で固定した Action のバージョンを、手で追いかけなくてよくするため
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # 開発用パッケージの更新は1つの PR にまとめる（PR が大量に届かないように）
      dev-dependencies:
        dependency-type: development
