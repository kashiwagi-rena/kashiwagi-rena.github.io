name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # コードを変えていなくても新しい脆弱性は毎日公開されるので、定期的にも実行する
  schedule:
    - cron: "17 0 * * 1" # 毎週月曜 9:17（日本時間）。cron は UTC で書く
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      - name: 署名の検証（改ざんチェック）
        run: npm audit signatures

      - name: 脆弱性レポート
        run: |
          {
            echo "## npm audit レポート"
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: critical の脆弱性があれば失敗
        run: npm audit --audit-level=critical
