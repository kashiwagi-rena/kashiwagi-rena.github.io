# 【移行用の一時ワークフロー】はてなの画像を取り込んで、このブランチに commit する
# この環境（Claude の作業環境）からははてなの画像サーバーに接続できないため、GitHub Actions に取りに行ってもらう
# 画像が取り込めたら削除する
name: はてなの画像を取り込み

on:
  push:
    branches: [migrate/hatena-blog]
    paths: [scripts/hatena-images.json, scripts/hatena-images.mjs]

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 画像をダウンロード
        run: node scripts/hatena-images.mjs
      - name: 位置情報などのメタデータ（EXIF）を削除
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl
          # 向き（Orientation）だけは残す。消すと写真が横向きに表示されることがあるため
          exiftool -q -all= -tagsfromfile @ -Orientation -overwrite_original assets/images/hatena/
          # GPS 情報が残っていないことを確かめる（残っていたら失敗にする）
          if exiftool -q -if '$GPSLatitude' -p '$FileName' assets/images/hatena/ | grep .; then
            echo "GPS 情報が残っている画像があります" && exit 1
          fi
      - name: commit して push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/hatena
          git commit -m "はてなブログの画像を取り込み（EXIF削除済み）"
          git push origin HEAD:migrate/hatena-blog
